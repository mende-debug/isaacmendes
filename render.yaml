# Blueprint da Render para o CRM Flow (app em ./crm-flow).
# SQLite precisa de disco persistente, disponível a partir do plano Starter.
services:
  - type: web
    name: crm-flow
    runtime: node
    rootDir: crm-flow
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        value: file:/var/data/crmflow.db
      - key: AUTH_SECRET
        generateValue: true
      - key: ALLOW_SIGNUP
        value: "true"
    disk:
      name: crmflow-data
      mountPath: /var/data
      sizeGB: 1
